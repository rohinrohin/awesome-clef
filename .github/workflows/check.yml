name: Check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
      - run: npm run build
      - name: Generated files must not be committed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^(README\.md|site/index\.html)$'; then
            echo "::error::README.md and site/index.html are generated by CI. Please revert them and only change data/projects.json."
            exit 1
          fi
