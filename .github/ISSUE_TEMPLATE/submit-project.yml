name: Submit a project
description: Add something built with Cloudflare Clef to the directory.
title: "Add: "
labels: [submission]
body:
  - type: input
    id: link
    attributes:
      label: Link
      description: GitHub repo, live site, or article.
      placeholder: https://github.com/you/your-clef-project
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Live site or demo (optional)
      placeholder: https://your-demo.workers.dev
  - type: textarea
    id: description
    attributes:
      label: What does it do, and where does Clef fit?
      description: One or two sentences in plain language. Link to the file or line that calls Clef if you can.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - SDKs & integrations
        - Agents & tooling
        - Browser & computer use
        - Applications
        - Demos & playgrounds
        - Benchmarks & evals
        - Fine-tuning & RL
        - Self-hosting & inference
        - Articles & tutorials
        - Not sure
    validations:
      required: true
